services:
  - type: web
    name: aarohan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://aarohan.vercel.app
      - key: JWT_SECRET
        generateValue: true

